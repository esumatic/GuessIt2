<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>GuessIt — Minimal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Dein App-Inhalt hier, z.B. sidebar, spielbereich ... -->
  </div>

  <!-- Modal Overlay -->
  <div id="modalOverlay" class="hidden"></div>

  <!-- API Key Eingabe Modal -->
  <div id="apiModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="apiModalTitle">
    <div class="modalContent">
      <h2 id="apiModalTitle">Google Maps API-Key</h2>
      <p>Der Key wird <strong>nicht</strong> gespeichert. Bitte eingeben:</p>
      <input id="apiKeyInput" type="text" placeholder="API Key" autocomplete="off" />
      <div class="modalActions">
        <button id="apiLoadBtn">Weiter</button>
      </div>
      <div id="apiStatus" style="margin-top:8px;font-size:13px;color:#666"></div>
    </div>
  </div>

  <!-- Message Modal -->
  <div id="messageModal" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="messageText">
    <div class="modalContent">
      <div id="messageText"></div>
      <div class="modalActions">
        <button id="messageOk">OK</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>

  <script>
  (function() {
    const apiModal = document.getElementById('apiModal');
    const modalOverlay = document.getElementById('modalOverlay');
    const apiInput = document.getElementById('apiKeyInput');
    const apiBtn = document.getElementById('apiLoadBtn');
    const statusEl = document.getElementById('apiStatus');
    let loading = false;
    let gameStarted = false;

    // Hilfsfunktionen zum Ein-/Ausblenden Modal & Overlay
    function showModal() {
      modalOverlay.classList.remove('hidden');
      apiModal.classList.remove('hidden');
      apiInput.focus();
    }
    function hideModal() {
      modalOverlay.classList.add('hidden');
      apiModal.classList.add('hidden');
      statusEl.textContent = '';
    }
    function showMessageModal() {
      modalOverlay.classList.remove('hidden');
      document.getElementById('messageModal').classList.remove('hidden');
    }
    function hideMessageModal() {
      modalOverlay.classList.add('hidden');
      document.getElementById('messageModal').classList.add('hidden');
    }

    // Prüfe, ob Maps API bereits geladen ist
    function isMapsLoaded() {
      return window.google && google.maps;
    }

    // Prüfe, ob bereits <script> mit maps geladen wurde
    function isMapsScriptPresent() {
      return Array.from(document.getElementsByTagName('script')).some(s => s.src && s.src.includes('maps.googleapis.com'));
    }

    // Google Maps Script laden mit API-Key und Callback
    function loadMapsApi(key) {
      if (loading) return;
      loading = true;
      statusEl.textContent = 'Lade Google Maps...';

      // Wenn Script schon da, initGame sofort starten
      if (isMapsScriptPresent()) {
        if (isMapsLoaded()) {
          statusEl.textContent = 'Maps API bereits geladen.';
          startGameOnce();
          hideModal();
          return;
        } else {
          statusEl.textContent = 'Maps-Script ist da, warte auf Ladeabschluss...';
          // Der Callback _onMapsReady muss in game.js definiert sein und rufen initGame
          return;
        }
      }

      // Erstelle Script-Tag mit callback
      window._onMapsReady = function() {
        loading = false;
        statusEl.textContent = '';
        hideModal();
        startGameOnce();
      };

      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&v=weekly&callback=_onMapsReady`;
      script.async = true;
      script.defer = true;
      script.onerror = function() {
        loading = false;
        statusEl.textContent = 'Fehler beim Laden. Bitte API-Key prüfen.';
      };
      document.head.appendChild(script);
    }

    // Spiel nur einmal starten, verhindert Doppelstarts
    function startGameOnce() {
      if (gameStarted) {
        console.log('Spiel bereits gestartet - Ignoriere erneuten Start');
        return;
      }
      gameStarted = true;
      if (window.initGame) {
        window.initGame();
      }
    }

    // Event-Listener Button Klick für API-Key laden
    apiBtn.addEventListener('click', () => {
      const key = apiInput.value.trim();
      if (!key) {
        statusEl.textContent = 'Bitte API-Key eingeben.';
        apiInput.focus();
        return;
      }
      loadMapsApi(key);
    });

    // OK Button Message Modal schließen
    document.getElementById('messageOk').addEventListener('click', () => {
      hideMessageModal();
    });

    // Beim Laden Seite prüfen, ob Maps schon da sind, sonst Modal zeigen
    document.addEventListener('DOMContentLoaded', () => {
      if (isMapsLoaded()) {
        console.log('Maps API bereits geladen, starte Spiel');
        startGameOnce();
      } else {
        console.log('Maps API nicht geladen, zeige Modal');
        showModal();
      }
    });
  })();
  </script>
</body>
</html>
